version: '3.8'

services:
  db:
    image: postgres:15
    container_name: cdgxpress_db_v2
    environment:
      POSTGRES_USER: cdgxpress_user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: cdgxpress
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cdgxpress_user -d cdgxpress"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: cdgxpress_backend_v2
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      POSTGRES_HOST: db
      POSTGRES_USER: cdgxpress_user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: cdgxpress
      POSTGRES_PORT: 5432
      # tx2 passenger-counting service (Serveur IA) — override via .env if it moves
      TX2_API_URL: ${TX2_API_URL:-http://10.136.115.100:8000}
    restart: unless-stopped

  pinger:
    build: ./pinger
    container_name: cdgxpress_pinger_v2
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_HOST: db
      POSTGRES_USER: cdgxpress_user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: cdgxpress
      POSTGRES_PORT: 5432
      PING_INTERVAL: 300
    restart: unless-stopped

  alarms-poller:
    build: ./alarms-poller
    container_name: cdgxpress_alarms_poller_v2
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_HOST: db
      POSTGRES_USER: cdgxpress_user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: cdgxpress
      POSTGRES_PORT: 5432
      ALARM_POLL_INTERVAL: 15
      # Set to false once the real XProtect server + credentials are known.
      XPROTECT_SIMULATE: ${XPROTECT_SIMULATE:-true}
      XPROTECT_BASE_URL: ${XPROTECT_BASE_URL:-https://xprotect.local}
      XPROTECT_USERNAME: ${XPROTECT_USERNAME:-}
      XPROTECT_PASSWORD: ${XPROTECT_PASSWORD:-}
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3000}
    container_name: cdgxpress_frontend_v2
    depends_on:
      - backend
    ports:
      - "5173:80"
    restart: unless-stopped

volumes:
  db_data:
